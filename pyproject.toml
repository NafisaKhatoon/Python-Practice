[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nafisakhatoon17-cloud", email = "nafisa.khatoon17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "llm-sdk",
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
]

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
