dependencies = [
    "accelerate>=1.16.0",
    "llm-sdk",
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
llm-sdk = { workspace = true }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]
